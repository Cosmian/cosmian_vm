[book]
title = "Eviden VM"
authors = ["Cosmian"]
language = "en"
src = "docs"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
site-url = "https://docs.cosmian.com/"
additional-css = ["theme/css/eviden.css", "theme/css/mdbook-admonish.css", "theme/css/tabs.css"]
additional-js = ["theme/mermaid.min.js", "theme/js/mermaid-init.js", "theme/js/tabs.js", "theme/js/theme-invert.js"]

[output.html.search]
enable = true

[output.html.fold]
enable = true
level = 1

[output.linkcheck]
follow-web-links = true
warning-policy = "error"
exclude = [
  'localhost',
  '@',
  # Cross-book references — other sections only exist in the combined book
  'key_management_system',
  'kms_clients',
  'findex',
  'eviden_ai',
  'eviden_enclave',
  'crates\.io',
  'cosmian\.com',
  'chrome://',
  'csrc\.nist\.gov',
  'nvlpubs\.nist\.gov',
  'support\.google\.com',
  'marketplace\.microsoft\.com',
]

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.1.0"

[preprocessor.tabs]
command = "python3 ../../theme/scripts/mdbook_tabs.py"

[preprocessor.mermaid]
command = "mdbook-mermaid"
